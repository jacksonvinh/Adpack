<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
  <meta name="description" content="">
  <link rel="stylesheet" href="css/style.css">
  <!--
    This file holds the LAYOUT only. You normally do NOT need to edit it.
    All text, prices, images and colors live in content.json
    (or edit them visually: run start-editor, see README.txt).
  -->
</head>
<body>

<div class="load-error" id="load-error" role="alert" hidden></div>

<!-- NAV -->
<header class="nav container" id="nav">
  <a class="brand" href="#top"></a>
  <a class="btn btn-primary" data-text="nav.ctaLabel" data-href="nav.ctaLink"></a>
</header>

<main id="top">
  <div id="sections"></div>
</main>

<!-- FOOTER -->
<footer class="footer" id="footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-about">
        <p data-text="footer.description"></p>
      </div>
      <div class="footer-col" data-show-if="$services">
        <div class="footer-title" data-text="footer.servicesTitle"></div>
        <div class="footer-links" data-list="$services" data-readonly>
          <template><a href="#pricing" data-text="name"></a></template>
        </div>
      </div>
      <div class="footer-col">
        <div class="footer-title" data-text="footer.contactTitle"></div>
        <div class="footer-links" data-list="footer.contacts" data-add-label="contact">
          <template data-default='{"label":"Label","value":"Value","link":""}'>
            <div><span class="lbl" data-text="label"></span><a data-text="value" data-href="link"></a></div>
          </template>
        </div>
      </div>
    </div>
    <div class="footer-copy" data-text="footer.copyright"></div>
  </div>
</footer>

<!-- Sticky "your total" bar (appears while the builder is off-screen) -->
<div class="sticky-bar" id="sticky-bar" aria-live="polite">
  <div class="sticky-info">
    <span class="sticky-total" id="sticky-total"></span>
    <span class="sticker sticker--small" id="sticky-save" hidden></span>
  </div>
  <a class="btn btn-pop" id="sticky-btn" href="checkout.html"></a>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>


<!-- ======================================================================
     SECTION TEMPLATES  (one per section "type" used in content.json)
     ====================================================================== -->

<template id="sec-hero">
  <section class="hero container">
    <div class="hero-frame">
      <div class="compare" data-compare="."></div>
      <div class="sticker sticker--drag" data-text="sticker" data-ph="Sticker text"></div>
    </div>
  </section>
</template>

<template id="sec-headline">
  <section class="headline">
    <div class="sticker sticker--tilt" data-text="eyebrow" data-ph="Small label"></div>
    <h1 data-text="title" data-ph="Main headline"></h1>
    <p data-text="subtitle" data-ph="Sub-headline"></p>
    <a class="btn btn-primary btn-lg" data-text="buttonLabel" data-href="buttonLink" data-ph="Button"></a>
  </section>
</template>

<template id="sec-marquee">
  <div class="marquee" data-requires="items">
    <div class="marquee-track" data-list="items" data-add-label="ticker phrase">
      <template data-default='"New phrase"'><span class="marquee-item" data-text="."></span></template>
    </div>
  </div>
</template>

<template id="sec-text">
  <section class="container split">
    <div class="split-head">
      <div class="eyebrow" data-text="eyebrow" data-ph="Small label"></div>
      <h2 data-text="title" data-ph="Title"></h2>
    </div>
    <div class="split-body about-text" data-list="items" data-add-label="paragraph">
      <template data-default='"New paragraph."'><p data-text="."></p></template>
    </div>
  </section>
</template>

<template id="sec-steps">
  <div class="band band--surface" data-requires="items">
    <div class="container">
      <div class="eyebrow" data-text="eyebrow" data-ph="Small label"></div>
      <h2 class="section-title" data-text="title" data-ph="Title"></h2>
      <div class="steps" data-list="items" data-layout="center" data-min="230" data-max="4" data-add-label="step">
        <template data-default='{"title":"New step","text":"Describe this step."}'>
          <div class="step">
            <div class="step-num" data-index></div>
            <h3 data-text="title"></h3>
            <p data-text="text"></p>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>

<template id="sec-checklist">
  <section class="container split" data-requires="items">
    <div class="split-head">
      <div class="eyebrow" data-text="eyebrow" data-ph="Small label"></div>
      <h2 data-text="title" data-ph="Title"></h2>
    </div>
    <div class="split-body benefit-list" data-list="items" data-add-label="point">
      <template data-default='{"title":"New point.","text":"Explain why it matters."}'>
        <div class="benefit">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <div><b data-text="title"></b> <span data-text="text"></span></div>
        </div>
      </template>
    </div>
  </section>
</template>

<template id="sec-gallery">
  <div class="band band--surface" data-requires="items">
    <div class="container">
      <div class="eyebrow" data-text="eyebrow" data-ph="Small label"></div>
      <h2 class="section-title" data-text="title" data-ph="Title"></h2>
      <p class="section-intro" data-text="intro" data-ph="Short intro"></p>
      <div class="gallery" data-list="items" data-layout="span" data-min="190" data-max="4" data-ph-cycle data-add-label="image">
        <template data-default='{"image":"","caption":"","alt":"","placeholder":"New image"}'>
          <figure class="tile">
            <div data-img="."></div>
            <figcaption data-text="caption" data-ph="Caption"></figcaption>
          </figure>
        </template>
      </div>
    </div>
  </div>
</template>

<template id="sec-builder">
  <section class="band band--blue builder">
    <div class="container">
      <div class="center-head">
        <div class="sticker sticker--tilt" data-text="eyebrow" data-ph="Small label"></div>
        <h2 class="section-title" data-text="title" data-ph="Title"></h2>
        <p class="section-intro" data-text="intro" data-ph="Short intro"></p>
      </div>


      <!-- Flash deal: extra % off the total. Texts: content.json -> builder.promo. Shown only while the deal is on. -->
      <div class="promo" hidden>
        <div class="promo-badge"><i class="promo-dot" aria-hidden="true"></i><span data-text="promo.badge" data-ph="Badge"></span></div>
        <div class="promo-main">
          <b class="promo-title" data-text="promo.title" data-ph="Deal title"></b>
          <span class="promo-sub" data-text="promo.text" data-ph="Short explanation"></span>
        </div>
        <div class="promo-pct" aria-hidden="true"><b></b></div>
        <div class="promo-clock" hidden>
          <span class="promo-clock-label" data-text="promo.timeText" data-ph="Ends in"></span>
          <span class="cd" role="timer" aria-label="Time left">
            <span class="cd-cell cd-dd"><b>00</b><i>d</i></span><span class="cd-cell"><b class="cd-h">00</b><i>h</i></span><span class="cd-cell"><b class="cd-m">00</b><i>m</i></span><span class="cd-cell cd-ss"><b class="cd-s">00</b><i>s</i></span>
          </span>
        </div>
        <div class="promo-slots" hidden>
          <span class="promo-slots-text"><b class="promo-left"></b> <span data-text="promo.slotsText" data-ph="spots left"></span></span>
          <span class="promo-bar" aria-hidden="true"><span class="promo-bar-fill"></span></span>
        </div>
        <p class="promo-ended" hidden data-text="promo.endedText" data-ph="Deal ended text"></p>
      </div>

      <div class="builder-grid">
        <div class="builder-main card">
          <div class="svc-list" data-list="services" data-add-label="service">
            <template data-default='{"id":"new-service","name":"New service","unit":"new service","description":"Describe this service.","price":5,"extraDiscount":5,"max":20,"startQty":0}'>
              <div class="svc" data-attr="data-sid:id">
                <div class="svc-info">
                  <h3 data-text="name" data-ph="Service name"></h3>
                  <p data-text="description" data-ph="Short description"></p>
                  <span class="svc-tag"></span>
                  <div class="svc-edit ed-only" data-editor-ui>
                    <label>Price <input type="number" step="0.01" min="0" data-num="price" data-live="builder"></label>
                    <label>Extra discount % <input type="number" step="0.5" min="0" max="50" data-num="extraDiscount" data-live="builder"></label>
                    <label>Max <input type="number" step="1" min="1" data-num="max" data-live="builder"></label>
                    <label>Preselected <input type="number" step="1" min="0" data-num="startQty" data-live="builder"></label>
                  </div>
                </div>
                <div class="svc-price">
                  <span class="svc-was"></span>
                  <span class="svc-now"></span>
                  <span class="svc-each">each</span>
                </div>
                <div class="stepper">
                  <button type="button" data-act="dec" aria-label="One fewer">&minus;</button>
                  <output class="svc-qty">0</output>
                  <button type="button" data-act="inc" aria-label="One more">+</button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <aside class="builder-summary">
          <div class="pct-sticker" hidden><span class="pct-num"></span><span class="pct-off" data-text="labels.off" data-fallback="OFF"></span></div>
          <h3 data-text="labels.yourOrder" data-fallback="Your order"></h3>
          <p class="receipt-empty"></p>
          <ul class="receipt"></ul>
          <div class="meter" aria-hidden="true"><div class="meter-fill"></div></div>
          <div class="meter-scale" aria-hidden="true"><span>0%</span><span class="meter-max"></span></div>
          <p class="meter-msg" aria-live="polite"></p>
          <p class="meter-hint"></p>
          <div class="totals">
            <div class="row row-regular"><span data-text="labels.regularLabel" data-fallback="Regular price"></span><s class="t-regular"></s></div>
            <div class="row row-save"><span data-text="labels.savingsLabel" data-fallback="You save"></span><b class="t-save"></b></div>
            <div class="row row-promo" hidden><span class="t-promo-label"></span><b class="t-promo"></b></div>
            <div class="row row-total"><span data-text="labels.totalLabel" data-fallback="Total"></span><b class="t-total"></b></div>
          </div>
          <a class="btn btn-pop btn-lg b-checkout" href="checkout.html" data-text="labels.checkoutLabel" data-fallback="Checkout"></a>
        </aside>
      </div>
    </div>
  </section>
</template>

<template id="sec-transformations">
  <div class="band band--navy" data-requires="items">
    <div class="container">
      <div class="center-head">
        <h2 class="section-title" data-text="title" data-ph="Title"></h2>
        <p class="section-intro" data-text="subtitle" data-ph="Short intro"></p>
      </div>
      <div class="transforms" data-list="items" data-layout="center" data-min="260" data-max="3" data-ph-cycle data-add-label="slider">
        <template data-default='{"before":{"image":"","alt":"Before","placeholder":"Before photo"},"after":{"image":"","alt":"After","placeholder":"After ad image"},"caption":"Example"}'>
          <figure class="trans">
            <div class="compare compare--tall" data-compare="."></div>
            <figcaption data-text="caption" data-ph="Caption"></figcaption>
          </figure>
        </template>
      </div>
    </div>
  </div>
</template>

<template id="sec-testimonials">
  <section class="container testimonials" data-requires="items">
    <div class="center-head">
      <div class="eyebrow" data-text="eyebrow" data-ph="Small label"></div>
      <h2 class="section-title" data-text="title" data-ph="Title"></h2>
    </div>
    <div class="quotes" data-list="items" data-layout="center" data-min="280" data-max="3" data-add-label="testimonial">
      <template data-default='{"quote":"Write the customer&apos;s words here.","name":"Customer name","role":"Shop name","avatar":"","rating":5}'>
        <figure class="quote-card">
          <div class="stars" data-text="rating" data-format="stars" aria-hidden="true"></div>
          <blockquote data-text="quote" data-ph="Quote"></blockquote>
          <figcaption class="quote-who">
            <div class="avatar" data-img="avatar"></div>
            <div>
              <div class="quote-name" data-text="name" data-ph="Name"></div>
              <div class="quote-role" data-text="role" data-ph="Role"></div>
              <label class="ed-only" data-editor-ui>Stars <input type="number" min="0" max="5" step="1" data-num="rating"></label>
            </div>
          </figcaption>
        </figure>
      </template>
    </div>
  </section>
</template>

<template id="sec-faq">
  <section class="faq-wrap" data-requires="items">
    <div class="eyebrow" data-text="eyebrow" data-ph="Small label"></div>
    <h2 class="section-title" data-text="title" data-ph="Title"></h2>
    <div class="faq" data-list="items" data-add-label="question">
      <template data-default='{"q":"New question?","a":"Your answer."}'>
        <div class="faq-item">
          <div class="faq-q" role="button" tabindex="0" aria-expanded="false">
            <span data-text="q" data-ph="Question"></span>
            <svg class="faq-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </div>
          <div class="faq-a" hidden data-text="a" data-ph="Answer"></div>
        </div>
      </template>
    </div>
  </section>
</template>

<template id="sec-banner">
  <section class="container banner-wrap">
    <div class="banner">
      <h2 data-text="title" data-ph="Big message"></h2>
      <p data-text="text" data-ph="Supporting line"></p>
      <a class="btn btn-pop btn-lg" data-text="buttonLabel" data-href="buttonLink" data-ph="Button"></a>
    </div>
  </section>
</template>


<!-- Before/after slider layout (used by the hero and the drag-to-compare examples) -->
<template id="tpl-compare">
  <div class="cmp-layer cmp-after">
    <div data-img="after"></div>
    <span class="chip chip--dark cmp-chip cmp-chip-right" data-text="afterLabel" data-fallback="After"></span>
  </div>
  <div class="cmp-layer cmp-before">
    <div data-img="before"></div>
    <span class="chip cmp-chip cmp-chip-left" data-text="beforeLabel" data-fallback="Before"></span>
  </div>
  <input class="cmp-range" type="range" min="0" max="100" step="0.5" value="50">
  <div class="cmp-handle" aria-hidden="true">
    <div class="cmp-knob">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/></svg>
    </div>
  </div>
</template>

<!-- One line of the order summary -->
<template id="tpl-receipt-line">
  <li class="rc-line">
    <span class="rc-name"></span><span class="rc-qty"></span>
    <span class="rc-money"><s class="rc-was"></s><b class="rc-price"></b></span>
  </li>
</template>

<script src="js/core.js"></script>
<script src="js/pricing.js"></script>
<script src="js/script.js"></script>
</body>
</html>
